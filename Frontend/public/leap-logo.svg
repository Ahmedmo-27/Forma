<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Violet rounded square background -->
  <rect width="100" height="100" rx="14" fill="#44298C"/>

  <!-- LEAP mark: bold white lightning bolt / swoosh shape.
       The logo shows a stylised left-leaning bolt: top-right to bottom-left
       with a flat left edge and angled right edge. -->
  <path
    d="
      M58 14
      L36 48
      L47 48
      L26 86
      L72 86
      L65 68
      L74 68
      L80 86
      L72 86
      Z
    "
    fill="none"
  />
  <!-- Clean version matching the logo: a filled chevron/bolt mark -->
  <path
    d="M60 13 L37 50 L49 50 L28 87 L64 87 L64 68 L74 68 L55 50 L67 50 Z"
    fill="#FFFFFF"
  />

  <!-- LEAP text at bottom -->
  <text
    x="50" y="97"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="15"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2.5"
  >LEAP</text>
</svg>
